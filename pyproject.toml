[project]
name = "me80-tone-gen"
version = "0.1.0"
description = "Natural-language → Boss ME-80 patch (.tsl) generator, local-only via Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "ollama>=0.4",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
tone-gen = "me80_tone_gen.cli:main"
tone-gen-serve = "me80_tone_gen.web:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/me80_tone_gen"]
