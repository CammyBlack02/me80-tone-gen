<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ME-80 AI Tone Generator</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #ff7a18;
    --accent-dim: #b8541f;
    --on: #3fb950;
    --off: #6e7681;
    --warn: #e3b341;
    --warn-strong: #ffd166;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header .accent { color: var(--accent); }
  header .version { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 16px; }

  label.field { display: block; margin-bottom: 14px; }
  label.field > .label { display: block; font-size: 13px; color: var(--text-dim);
    margin-bottom: 6px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font: inherit; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 80px; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }

  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .row > label { margin-bottom: 0; }

  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer;
    user-select: none; font-size: 13px; color: var(--text-dim); }
  .toggle input { accent-color: var(--accent); }

  button.primary { background: var(--accent); color: #1a1100; border: none;
    border-radius: 6px; padding: 11px 22px; font: inherit; font-weight: 600;
    cursor: pointer; transition: background 80ms ease; font-size: 14px; }
  button.primary:hover { background: #ff8a35; }
  button.primary:disabled { background: var(--accent-dim); color: #322618; cursor: progress; }

  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; font-size: 13px; }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }

  .controls { display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; }

  .recipe-badge { display: inline-block; background: rgba(255, 122, 24, 0.12);
    color: var(--accent); border: 1px solid rgba(255, 122, 24, 0.3);
    border-radius: 999px; padding: 3px 10px; font-size: 12px;
    font-family: var(--mono); margin-bottom: 12px; }

  .patch-name { font-size: 18px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.02em; }
  .rationale { color: var(--text-dim); font-style: italic; margin: 0 0 14px;
    border-left: 2px solid var(--border); padding-left: 12px; }

  pre.knob-list { background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 16px; font-family: var(--mono); font-size: 13px;
    color: var(--text); margin: 0 0 14px; overflow-x: auto; line-height: 1.5; }

  .results { display: none; }
  .results.visible { display: block; }

  .variants-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 700px) { .variants-grid { grid-template-columns: 1fr; } }
  .variant-card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color 100ms ease; }
  .variant-card:hover { border-color: var(--accent-dim); }
  .variant-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .variant-card .variant-label { font-family: var(--mono); font-size: 12px;
    color: var(--text-dim); margin-bottom: 6px; }
  .variant-card .patch-name { font-size: 16px; }
  .variant-card pre.knob-list { font-size: 12px; padding: 10px; }

  .error { background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.4);
    border-radius: 6px; padding: 14px 16px; color: #ffa198; font-family: var(--mono);
    font-size: 13px; margin-bottom: 16px; }

  .banner { background: rgba(210, 153, 34, 0.12); border: 1px solid rgba(210, 153, 34, 0.4);
    border-radius: 6px; padding: 12px 16px; color: var(--warn); font-size: 13px;
    margin-bottom: 16px; display: flex; align-items: flex-start; gap: 12px; }
  .banner .banner-body { flex: 1; }
  .banner .banner-title { font-weight: 600; margin-bottom: 4px; color: var(--warn-strong); }
  .banner .banner-fix { display: block; margin-top: 6px; font-family: var(--mono);
    font-size: 12px; color: var(--text); background: rgba(0,0,0,0.25); padding: 6px 8px;
    border-radius: 4px; }
  .banner .banner-actions { display: flex; gap: 6px; }
  .banner button { background: transparent; color: var(--warn);
    border: 1px solid rgba(210, 153, 34, 0.5);
    border-radius: 4px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .banner button:hover { border-color: var(--warn); }

  .empty { color: var(--text-dim); text-align: center; padding: 40px 0; }

  details.recipes { font-size: 13px; color: var(--text-dim); }
  details.recipes summary { cursor: pointer; color: var(--text-dim); padding: 4px 0; }
  details.recipes summary:hover { color: var(--accent); }
  details.recipes ul { margin: 8px 0 0; padding-left: 18px; }
  details.recipes code { color: var(--text); font-size: 12px; }

  .footer-note { color: var(--text-dim); font-size: 12px; margin-top: 24px;
    text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ME-80 <span class="accent">AI Tone Generator</span></h1>
    <span class="version" id="version">·</span>
  </header>

  <div id="ready-banner" class="banner" style="display:none;"></div>

  <form id="gen-form" class="card">
    <label class="field">
      <span class="label">Describe the tone</span>
      <textarea id="description" placeholder="e.g. warm bluesy lead with spring reverb"
                autofocus required></textarea>
    </label>

    <div class="row">
      <label class="field">
        <span class="label">Model</span>
        <input type="text" id="model" value="qwen2.5:14b" />
      </label>
      <label class="field">
        <span class="label">Variants</span>
        <input type="number" id="variants" value="1" min="1" max="5" />
      </label>
      <label class="field">
        <span class="label">Retries</span>
        <input type="number" id="retries" value="2" min="0" max="5" />
      </label>
      <label class="field">
        <span class="label">Liveset name</span>
        <input type="text" id="liveset-name" value="Generated" />
      </label>
    </div>

    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="use-recipes" checked />
        Use curated recipes (RAG)
      </label>
      <button type="submit" id="generate-btn" class="primary">Generate</button>
    </div>
  </form>

  <section id="results" class="results">
    <div id="recipe-badge"></div>
    <div id="variants-container"></div>
    <div class="controls" style="margin-top: 16px;">
      <span id="pick-status" style="color: var(--text-dim); font-size: 13px;"></span>
      <div style="display: flex; gap: 8px;">
        <button class="secondary" id="download-btn">Download .tsl</button>
        <button class="secondary" id="copy-json-btn">Copy JSON</button>
      </div>
    </div>
  </section>

  <div id="error" style="display:none;" class="error"></div>

  <details class="recipes" id="recipes-panel">
    <summary>Available recipes (click to expand)</summary>
    <ul id="recipes-list"></ul>
  </details>

  <p class="footer-note">Local-only. All inference runs on this machine via Ollama.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
let activeVariantIdx = 0;
let lastVariants = [];

async function fetchHealth() {
  try {
    const r = await fetch("/api/health");
    if (r.ok) {
      const data = await r.json();
      $("version").textContent = "v" + data.version;
    }
  } catch (_) {}
}

function renderReadyBanner(data) {
  const el = $("ready-banner");
  if (data.ready) {
    el.style.display = "none";
    return;
  }
  el.style.display = "flex";
  const titles = {
    ollama_unreachable: "Ollama isn't running",
    model_not_pulled: "Model isn't pulled",
  };
  const title = titles[data.issue] || "Ollama isn't ready";
  const fix = data.fix
    ? `<code class="banner-fix">${data.fix}</code>`
    : "";
  el.innerHTML = `
    <div class="banner-body">
      <div class="banner-title">${title}</div>
      <div>${data.message || ""}</div>
      ${fix}
    </div>
    <div class="banner-actions">
      <button id="ready-retry">Retry</button>
      <button id="ready-dismiss">Dismiss</button>
    </div>`;
  $("ready-retry").addEventListener("click", checkReady);
  $("ready-dismiss").addEventListener("click", () => { el.style.display = "none"; });
}

async function checkReady() {
  try {
    const model = $("model").value.trim();
    const url = "/api/ready" + (model ? `?model=${encodeURIComponent(model)}` : "");
    const r = await fetch(url);
    if (!r.ok) return;
    renderReadyBanner(await r.json());
  } catch (_) {
    renderReadyBanner({
      ready: false,
      issue: "ollama_unreachable",
      message: "Cannot reach the server.",
      fix: "",
    });
  }
}

async function fetchRecipes() {
  try {
    const r = await fetch("/api/recipes");
    if (!r.ok) return;
    const data = await r.json();
    const ul = $("recipes-list");
    ul.innerHTML = "";
    for (const recipe of data.recipes) {
      const li = document.createElement("li");
      const aliasList = recipe.aliases.map((a) => `<code>${a}</code>`).join(", ");
      li.innerHTML = `<strong>${recipe.id}</strong> — ${recipe.description}<br/><small>aliases: ${aliasList}</small>`;
      ul.appendChild(li);
    }
  } catch (_) {}
}

function downloadTsl(liveset, name) {
  const blob = new Blob([JSON.stringify(liveset)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${name || "patch"}.tsl`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function copyJson(obj) {
  try {
    await navigator.clipboard.writeText(JSON.stringify(obj, null, 2));
    const btn = $("copy-json-btn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = original; }, 1200);
  } catch (e) {
    alert("Couldn't copy to clipboard: " + e.message);
  }
}

function renderVariantCard(variant, idx, isSingle) {
  const card = document.createElement("div");
  card.className = "variant-card" + (idx === activeVariantIdx ? " active" : "");
  card.dataset.idx = String(idx);

  if (!isSingle) {
    const label = document.createElement("div");
    label.className = "variant-label";
    label.textContent = `Variant ${idx + 1}`;
    card.appendChild(label);
  }

  const name = document.createElement("p");
  name.className = "patch-name";
  name.textContent = variant.patch.patch_name;
  card.appendChild(name);

  const rationale = document.createElement("p");
  rationale.className = "rationale";
  rationale.textContent = variant.patch.rationale || "";
  card.appendChild(rationale);

  const knobs = document.createElement("pre");
  knobs.className = "knob-list";
  knobs.textContent = variant.knob_list_text;
  card.appendChild(knobs);

  card.addEventListener("click", () => setActive(idx));
  return card;
}

function setActive(idx) {
  activeVariantIdx = idx;
  document.querySelectorAll(".variant-card").forEach((el) => {
    el.classList.toggle("active", Number(el.dataset.idx) === idx);
  });
  const status = $("pick-status");
  status.textContent = lastVariants.length > 1
    ? `Active: variant ${idx + 1} of ${lastVariants.length}`
    : "";
}

function renderResult(data) {
  lastVariants = data.variants;
  activeVariantIdx = 0;
  const container = $("variants-container");
  container.innerHTML = "";
  const isSingle = lastVariants.length === 1;
  container.className = isSingle ? "" : "variants-grid";
  lastVariants.forEach((v, i) => container.appendChild(renderVariantCard(v, i, isSingle)));
  const badge = $("recipe-badge");
  badge.innerHTML = "";
  if (data.recipe_matched_id) {
    const chip = document.createElement("span");
    chip.className = "recipe-badge";
    chip.textContent = `Recipe: ${data.recipe_matched_id}`;
    badge.appendChild(chip);
  }
  setActive(0);
  $("results").classList.add("visible");
  $("error").style.display = "none";
}

function showError(msg) {
  const el = $("error");
  el.textContent = msg;
  el.style.display = "block";
  $("results").classList.remove("visible");
}

$("gen-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("generate-btn");
  btn.disabled = true;
  btn.textContent = "Generating...";
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        description: $("description").value.trim(),
        model: $("model").value.trim(),
        retries: parseInt($("retries").value, 10),
        use_recipes: $("use-recipes").checked,
        liveset_name: $("liveset-name").value.trim() || "Generated",
        variants: parseInt($("variants").value, 10) || 1,
      }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: { message: "request failed" } }));
      const msg = (err.detail && err.detail.message) || err.detail || `HTTP ${r.status}`;
      showError(typeof msg === "string" ? msg : JSON.stringify(msg));
      checkReady();
      return;
    }
    renderResult(await r.json());
  } catch (e) {
    showError("Network error: " + e.message);
    checkReady();
  } finally {
    btn.disabled = false;
    btn.textContent = "Generate";
  }
});

$("download-btn").addEventListener("click", () => {
  if (!lastVariants.length) return;
  const v = lastVariants[activeVariantIdx];
  downloadTsl(v.liveset, v.patch.patch_name);
});

$("copy-json-btn").addEventListener("click", () => {
  if (!lastVariants.length) return;
  copyJson(lastVariants[activeVariantIdx].patch);
});

fetchHealth();
fetchRecipes();
checkReady();
</script>
</body>
</html>
